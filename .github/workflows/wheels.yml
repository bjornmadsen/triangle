name: Build Wheels

on:
  push:
    tags: ["v*"]

jobs:
  build_wheels:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Each runner builds for its native arch, so no QEMU emulation:
        # Linux x86_64 and aarch64, Windows AMD64, macOS arm64.
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.3.5

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/

  release:
    name: Create GitHub Release
    needs: build_wheels
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

  publish_jfrog:
    name: Publish to JFrog
    needs: build_wheels
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@v10.4.0

      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - name: Upload wheels to JFrog
        env:
          JFROG_USER: ${{ secrets.JFROG_USER }}
          JFROG_TOKEN: ${{ secrets.JFROG_TOKEN }}
        run: |
          uvx twine upload \
            --repository-url https://locusbots.jfrog.io/artifactory/api/pypi/locus-triangle/ \
            -u "$JFROG_USER" -p "$JFROG_TOKEN" \
            dist/*.whl
