name: Build Wheels

on:
  push:
    tags: ["v*"]

# Opt into Node.js 24 now — actions/setup-python (used internally by
# cibuildwheel) is still on Node.js 20 and would otherwise warn.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_wheels:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest (x86_64) and ubuntu-24.04-arm (aarch64) each build
        # for their native arch — no QEMU emulation needed.
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-14]

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.1

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/

  release:
    name: Create GitHub Release
    needs: build_wheels
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

  publish_jfrog:
    name: Publish to JFrog
    needs: build_wheels
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - name: Upload wheels to JFrog
        env:
          JFROG_USER: ${{ secrets.JFROG_USER }}
          JFROG_TOKEN: ${{ secrets.JFROG_TOKEN }}
        run: |
          uvx twine upload \
            --repository-url https://locusbots.jfrog.io/artifactory/api/pypi/locus-triangle/ \
            -u "$JFROG_USER" -p "$JFROG_TOKEN" \
            dist/*.whl
