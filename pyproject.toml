[build-system]
requires = [
    'Cython >=3.3.0',
    'setuptools >=61',
]
build-backend = 'setuptools.build_meta'

[project]
name = 'triangle'
dynamic = ['version']
authors = [
    { name = 'Dzhelil Rufat', email = 'd@rufat.be' },
]
description = 'Python binding to the triangle library'
readme = 'README.rst'
license = { text = 'LGPL-3.0' }
requires-python = '>=3.11'
classifiers = [
    'Programming Language :: Python :: 3',
    'Programming Language :: Python :: 3 :: Only',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Programming Language :: Python :: 3.14',
    'Programming Language :: Python :: 3.15',
]
dependencies = [
    'numpy',
]

[project.optional-dependencies]
test = [
    'pytest',
]

[project.urls]
Homepage = 'https://rufat.be/triangle'
Repository = 'https://github.com/drufat/triangle'

[tool.setuptools]
include-package-data = false
packages = ['triangle']

[tool.setuptools.dynamic]
version = { attr = 'triangle.version.__version__' }

[tool.setuptools.package-data]
triangle = [
    'data/*.node',
    'data/*.ele',
    'data/*.poly',
    'data/*.area',
    'data/*.edge',
    'data/*.neigh',
]

[tool.cibuildwheel]
build = ["cp311-*", "cp312-*", "cp313-*", "cp314-*", "cp315-*"]
skip = ["*musllinux*", "*-manylinux_i686", "*-win32"]
test-requires = "pytest"
test-command = "pytest {project}/tests"

[tool.cibuildwheel.linux]
archs = ["native"]

[tool.cibuildwheel.macos]
archs = ["arm64"]

[tool.cibuildwheel.windows]
archs = ["AMD64"]
